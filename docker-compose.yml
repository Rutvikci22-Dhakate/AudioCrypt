# AudioCrypt - Docker Compose Configuration
version: '3.8'

services:
  # AudioCrypt Web Application
  audiocrypt:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - MONGO_URI=mongodb://mongo:27017/
      - SECRET_KEY=your-super-secret-key-change-in-production
    volumes:
      - ./uploads:/app/uploads
      - ./decrypted:/app/decrypted
      - ./logs:/app/logs
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - audiocrypt-network

  # MongoDB Database
  mongo:
    image: mongo:4.5
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=audio_encryption_db
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - audiocrypt-network

  # Redis for Session Storage (Optional)
  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - audiocrypt-network
    command: redis-server --appendonly yes

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - audiocrypt
    restart: unless-stopped
    networks:
      - audiocrypt-network
    profiles:
      - production

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  audiocrypt-network:
    driver: bridge

# Development override
---
version: '3.8'
services:
  audiocrypt:
    build:
      context: .
      target: development
    volumes:
      - .:/app
      - /app/__pycache__
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    command: python app.py